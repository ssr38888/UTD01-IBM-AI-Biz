# FallWatch on LinuxONE: API + PostgreSQL + Caddy (HTTPS, required for phone cameras).
# All images publish linux/s390x builds.
#   cd deploy && cp .env.example .env && (edit .env) && docker compose up -d --build
# Podman works too: podman-compose up -d --build
#
# Pictures are stored on a volume on the LinuxONE box by default (STORAGE_BACKEND=local).
# To use S3-compatible object storage instead (IBM Cloud Object Storage, Ceph RGW, ...),
# set STORAGE_BACKEND=s3 and the S3_* values in .env.

services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://fallwatch:${POSTGRES_PASSWORD}@db:5432/fallwatch
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: /srv/fallwatch/data/objects
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-fallwatch-evidence}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_RETENTION_DAYS: ${S3_RETENTION_DAYS:-0}
      DEVICE_KEYS: ${DEVICE_KEYS}
      VIEWER_KEYS: ${VIEWER_KEYS}
      SNAPSHOT_INTERVAL_MS: ${SNAPSHOT_INTERVAL_MS:-750}
      BURST_INTERVAL_MS: ${BURST_INTERVAL_MS:-300}
      PRE_EVENT_MS: ${PRE_EVENT_MS:-5000}
      POST_EVENT_MS: ${POST_EVENT_MS:-5000}
      HEARTBEAT_SEC: ${HEARTBEAT_SEC:-0}
    volumes: [evidence:/srv/fallwatch/data]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fallwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fallwatch
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fallwatch"]
      interval: 5s
      retries: 20

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [api]

volumes:
  evidence:
  pgdata:
  caddy:
