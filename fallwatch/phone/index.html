<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>FallWatch Capture</title>
  <link rel="stylesheet" href="style.css?v=30">
  <link rel="stylesheet" href="navigation.css?v=30">
</head>
<body>
  <header class="sitebar">
    <div class="navigation">
      <button id="menuToggle" class="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="appMenu"><span></span><span></span><span></span></button>
      <nav id="appMenu" class="app-menu" aria-label="Main navigation" hidden>
        <button data-view="camera" aria-current="page">Camera</button>
        <button data-view="logs">Logs</button>
      </nav>
    </div>
    <a class="brand" href="/frontend/?v=30#ledger">FallWatch / Dashboard</a><span id="pageName" class="page-name">Camera</span>
  </header>
  <main id="cameraView">
  <!-- Setup screen -->
  <section id="setup" class="panel">
    <h1>FallWatch <span class="sub">camera</span></h1>
    <p class="lede">Position the camera so the whole person and floor are visible. Once started, monitoring detects falls and saves event evidence automatically.</p>

    <button id="startBtn" class="primary">Start</button>
    <p id="setupMsg" class="msg" role="status"></p>
  </section>

  <!-- Live screen -->
  <section id="live" hidden>
    <div class="monitor-bar">
      <div><span class="status-dot"></span> Live camera <span id="sPosture" class="posture">Connecting…</span></div>
      <button id="torchBtn" type="button" aria-pressed="false" hidden>Torch on</button>
      <button id="stopBtn" class="danger">Stop monitoring</button>
    </div>

    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="rec"><span class="dot"></span>Monitoring</div>
      <div id="banner" class="banner watching">Watching</div>
    </div>

    <p id="liveMsg" class="msg" role="status"></p>
  </section>

  </main>
  <section id="logsView" hidden><iframe id="logsFrame" title="FallWatch event log"></iframe></section>
  <script type="module" src="navigation.js?v=30"></script>
  <script type="module" src="app.js?v=30"></script>
</body>
</html>
